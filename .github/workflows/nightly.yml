# A nightly release of main, made on demand: Actions > Nightly > Run workflow.
# It builds the Linux AppImage and the Windows ZIP as the releases are built, and publishes them as a prerelease of the next minor
# version, such as v0.2.0-nightly.20261020.5. See docs/packaging.md.
name: Nightly

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          IFS=. read -r major minor _ <<< "${current%%-*}"
          # The run number orders nightlies of one day and keeps each tag
          # new; the release's title names the commit.
          echo "version=$major.$((minor + 1)).0-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # A fresh runner installs Rust and fetches the crates for longer than
      # scripts/package-linux.py gives cargo metadata.
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      # The AppImage's binary as an Arch package, in an Arch container.
      - run: scripts/package-arch
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            target/dist/linux/Votecord-*
            target/dist/linux/votecord-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # Skia built for Windows, and the MSVC CRT and SDK it was built against,
      # which nix/prepare-windows-skia.py checks before reusing it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      # The compiled dependencies. Before scripts/set-version, which changes
      # Cargo.lock, so the key changes only with the dependencies.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ needs.version.outputs.version }}"
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so Inno
      # Setup can't make the installer there.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Votecord-*
          if-no-files-found: error
          compression-level: 0

  windows-installer:
    needs: [version, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist/windows
      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $expected = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup SHA-256 mismatch: $actual" }
          $destination = Join-Path $env:RUNNER_TEMP "InnoSetup"
          $process = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/NORESTART", "/DIR=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup exited with $($process.ExitCode)" }
      - name: Build Windows setup installer
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $zip = Get-ChildItem "dist/windows/Votecord-$env:VERSION-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "Portable Windows ZIP not found" }
          $package = Join-Path $env:RUNNER_TEMP "VotecordPackage"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $package -Force
          $source = Join-Path $package "Votecord-$env:VERSION-windows-x64"
          if (-not (Test-Path (Join-Path $source "votecord.exe"))) { throw "votecord.exe missing from package" }
          $output = (Resolve-Path "dist/windows").Path
          $versionNumber = ($env:VERSION -split "-")[0]
          $iscc = Join-Path $env:RUNNER_TEMP "InnoSetup/ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DVersionNumber=$versionNumber" "/DSourceDir=$source" "/O$output" "packaging/windows/votecord.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with $LASTEXITCODE" }
          $setup = Join-Path $output "Votecord-$env:VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Setup executable was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/windows/Votecord-*-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.ref == 'refs/heads/main'
    needs: [version, linux, windows, windows-installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMIT: ${{ needs.version.outputs.commit }}
    steps:
      # Only for the notes' jq program.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        run: |
          # A failed request must fail the job, not leave the list empty.
          set -o pipefail
          # Both jobs zip the commit's source; SOURCE.txt and each BUILD.json
          # name the one file the release carries.
          cmp "dist/linux/Votecord-$VERSION-source.zip" "dist/windows/Votecord-$VERSION-source.zip"
          mkdir release
          mv dist/linux/Votecord-* dist/linux/votecord-*.pkg.tar.zst release/
          mv dist/windows/Votecord-*-windows-x64* release/
          (cd release && sha256sum Votecord-* votecord-*.pkg.tar.zst > SHA256SUMS.txt)
          # The newest nightly, or before the first one the latest release.
          previous=$(gh release list --exclude-drafts --limit 100 --json tagName \
            --jq '[.[].tagName | select(contains("-nightly."))][0] // empty')
          if [ -z "$previous" ]; then
            previous=$(gh release view --json tagName --jq .tagName || true)
          fi
          {
            echo "A nightly build of main at $COMMIT, for testing what's coming in the next release. Expect rough edges."
            echo
            if [ -n "$previous" ]; then
              echo "## Changes since $previous"
              echo
              # The API lists at most 250 commits; the link below has them all.
              gh api "repos/$GH_REPO/compare/$previous...$COMMIT" | jq -r -f .github/nightly-notes.jq
              echo "All changes: https://github.com/$GH_REPO/compare/$previous...$COMMIT"
              echo
            fi
            echo "AppImage updaters take the AppImage to the latest stable release, not to newer nightlies."
            echo
            echo "On Arch Linux, install the .pkg.tar.zst with \`sudo pacman -U\` and its link."
          } > notes.md
          # Titled as the stable releases are, with the commit: the version
          # already says it's a nightly.
          gh release create "v$VERSION" release/* --prerelease --target "$COMMIT" \
            --title "Votecord $VERSION (${COMMIT:0:7})" --notes-file notes.md
